<!doctype html><meta charset="utf-8"><title>teste tinta</title><pre id="out">...</pre>
<script type="module">
import { ort, InferenceEngine, preprocessStrokes, loadVocab } from '../vendor/tinta/tinta.js';
const base = new URL('../vendor/tinta/', location.href).href;
ort.env.wasm.wasmPaths = { mjs: base + 'ort-wasm-simd-threaded.js', wasm: base + 'ort-wasm-simd-threaded.wasm' };
ort.env.wasm.numThreads = 1;
const out = document.getElementById('out');
const arc = (cx, cy, r, a0, a1, n = 14) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; });
const lin = (x0, y0, x1, y1, n = 8) => Array.from({ length: n + 1 }, (_, i) => ({ x: x0 + (x1 - x0) * i / n, y: y0 + (y1 - y0) * i / n }));
const S = (pts) => ({ points: pts, lineWidth: 3 });
const glifo = {
  '2': (o) => [S([...arc(o + 20, 35, 18, Math.PI * 1.1, Math.PI * 2.2), ...lin(o + 36, 45, o + 2, 90).slice(1), ...lin(o + 2, 90, o + 40, 90).slice(1)])],
  '3': (o) => [S([...arc(o + 18, 32, 16, Math.PI * 1.2, Math.PI * 2.5), ...arc(o + 18, 70, 20, Math.PI * 1.5, Math.PI * 2.85).slice(1)])],
  '7': (o) => [S([...lin(o, 15, o + 40, 15), ...lin(o + 40, 15, o + 15, 90).slice(1)])],
  'x': (o) => [S(lin(o, 45, o + 32, 90)), S(lin(o + 32, 45, o, 90))],
  '+': (o) => [S(lin(o, 60, o + 36, 60)), S(lin(o + 18, 42, o + 18, 78))],
  '=': (o) => [S(lin(o, 52, o + 36, 52)), S(lin(o, 70, o + 36, 70))],
  '5': (o) => [S([...lin(o + 36, 15, o + 4, 15), ...lin(o + 4, 15, o + 2, 48).slice(1), ...arc(o + 18, 68, 21, Math.PI * 1.3, Math.PI * 2.8).slice(1)])],
};
function escrever(txt) { let o = 10, st = []; for (const c of txt) { st.push(...glifo[c](o)); o += 55; } return st; }
(async () => {
  try {
    const t0 = performance.now();
    const vocab = await loadVocab('../vendor/tinta/modelo/vocab.json');
    const eng = new InferenceEngine({ encoderUrl: '../vendor/tinta/modelo/encoder_int8.onnx', decoderUrl: '../vendor/tinta/modelo/decoder_int8.onnx', beamWidth: 3, executionProvider: 'wasm' });
    await eng.init();
    const res = [];
    for (const t of ['2+3=5', '2x+3=7', '7x=3']) { const r = await eng.recognize(preprocessStrokes(escrever(t)), vocab); res.push(t + ' -> ' + r.latex + ' (' + Math.round(r.totalMs) + 'ms)'); }
    out.textContent = 'OK init ' + Math.round(performance.now() - t0) + 'ms\n' + res.join('\n');
  } catch (e) { out.textContent = 'ERRO ' + e.message + '\n' + e.stack; }
})();
</script>
