name: Publicar servidor da IA
on:
  push:
    branches: [main]
    paths: ['servidor/**']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          CA: ${{ secrets.GAIPO_CHAVE_APP }}
        run: |
          [ -n "$CF" ] || { echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$AK" ] || { echo "::error::Falta o segredo ANTHROPIC_API_KEY"; exit 1; }
          [ -n "$CA" ] || { echo "::error::Falta o segredo GAIPO_CHAVE_APP"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: servidor
      - run: node teste.mjs
        working-directory: servidor
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: servidor
          secrets: |
            ANTHROPIC_API_KEY
            CHAVE_APP
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAVE_APP: ${{ secrets.GAIPO_CHAVE_APP }}
